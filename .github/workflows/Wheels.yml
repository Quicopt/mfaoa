# Builds the wheels and the sdist with cibuildwheel and tests each wheel (see
# [tool.cibuildwheel] in pyproject.toml). A published GitHub release also
# uploads them to PyPI, through PyPI's trusted publishing.
name: Wheels
on:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read

jobs:
  wheels:
    name: Wheel, ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-latest, archs: auto64 }
          - { name: Linux aarch64, os: ubuntu-24.04-arm, archs: auto64 }
          - { name: macOS arm64, os: macos-latest, archs: arm64 }
          # Built on Apple Silicon, tested under Rosetta 2.
          - { name: macOS x86_64, os: macos-latest, archs: x86_64 }
          - { name: Windows x64, os: windows-latest, archs: auto64 }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.archs }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Upload to PyPI
    if: github.event_name == 'release'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.3
