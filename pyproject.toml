# The Python package: the C library, built without a BLAS, plus the Python
# code in python/mfaoa, which passes SciPy's dgemv for dense couplings. The
# library is not a Python extension module, so one wheel per platform serves
# every Python 3 version.

[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "mfaoa"
dynamic = ["version"]
description = "Binary quadratic optimization with MFAOA, the mean-field approximate optimization algorithm"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tim Bode" }]
maintainers = [{ name = "Quicopt" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11.2"]
keywords = ["optimization", "QUBO", "Ising", "binary quadratic programming", "max-cut", "Pyomo", "dimod"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Quicopt = "https://quicopt.com"
Source = "https://github.com/Quicopt/mfaoa"
Issues = "https://github.com/Quicopt/mfaoa/issues"

[project.optional-dependencies]
# Pyomo's solver interface (pyomo.contrib.solver) is still a preview; its
# modules moved in 6.9.2 and again in 6.10.0, and 6.10.1 added the
# get_infeasible_results that mfaoa.pyomo uses.
pyomo = ["pyomo>=6.10.1"]
dimod = ["dimod>=0.12.14"]
test = ["pytest", "pyomo>=6.10.1", "dimod>=0.12.14"]
# The documentation site (mkdocs build / mkdocs serve); its examples run
# at build time, so the build also needs the pyomo and dimod extras.
docs = ["mkdocs-material>=9", "mkdocstrings[python]>=0.24", "markdown-exec>=1.9", "black"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.21"
wheel.py-api = "py3"
wheel.packages = ["python/mfaoa"]
sdist.exclude = ["build", ".venv", "plan-*.md", "docs", "mkdocs.yml", "site", "gset"]

[tool.scikit-build.cmake.define]
MFAOA_BLAS = "OFF"
MFAOA_BUILD_TESTS = "OFF"
BUILD_SHARED_LIBS = "ON"

# The version is written once, in include/mfaoa.h.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "include/mfaoa.h"
regex = '#define MFAOA_VERSION "(?P<value>[^"]+)"'

[tool.pytest.ini_options]
testpaths = ["python/tests"]

# Wheels: built once per platform with the oldest supported Python (the
# wheel is py3-none and serves every Python 3), then tested with the oldest
# and the newest. Five platforms: Linux x86_64 and aarch64 (manylinux), macOS
# arm64 and x86_64, Windows x64.
[tool.cibuildwheel]
build = ["cp310-*", "cp315-*"]
skip = ["*-musllinux_*"]
archs = ["auto64"]
test-extras = ["test"]
test-command = "pytest {project}/python/tests"

[tool.cibuildwheel.macos]
# macOS 11 is the first with Apple Silicon; the library needs nothing newer.
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
# The DLL depends on the C runtime only, so delvewheel has nothing to bundle.
repair-wheel-command = ""
